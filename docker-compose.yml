# ─── KodeChirp Production-Grade Stack ────────────────────────────────────────

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kodechirp-postgres
    environment:
      POSTGRES_DB: kodechirp
      POSTGRES_USER: kodechirp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodechirp_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:Z
      - ./database/seeds/01-seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:Z
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:Z
      - ./database/init-migrations.sh:/docker-entrypoint-initdb.d/03-init-migrations.sh:Z
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodechirp -d kodechirp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kodechirp-net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kodechirp-redis
    command: >
      redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --save 60 1000
        --loglevel warning
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kodechirp-net

  # ── Node.js API Gateway ──────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: kodechirp-gateway:latest
    container_name: kodechirp-gateway
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://kodechirp:${POSTGRES_PASSWORD:-kodechirp_dev}@postgres:5432/kodechirp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WORKER_API_URL: http://worker:8000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-KodeChirp <onboarding@resend.dev>}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kodechirp-net

  # ── Python FastAPI Worker ────────────────────────────────────────────────
  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
    image: kodechirp-worker:latest
    container_name: kodechirp-worker
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://kodechirp:${POSTGRES_PASSWORD:-kodechirp_dev}@postgres:5432/kodechirp
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      EXECUTION_TIMEOUT: ${EXECUTION_TIMEOUT:-10}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      DOCKER_HOST: tcp://docker-proxy:2375
      SUBMISSION_QUEUE: kodechirp-submissions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    volumes:
      - /tmp/kodechirp:/tmp/kodechirp:z
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - kodechirp-net
      - kodechirp-sandbox-net

  # ── Docker Socket Proxy (Hardened & Network-Isolated) ────────────────────
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: kodechirp-docker-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      AUTH: 0
      BUILD: 0
      EXEC: 1
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    user: root
    security_opt:
      - label=disable
    restart: unless-stopped
    networks:
      - kodechirp-sandbox-net

  # ── Frontend (Standalone Production Build) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: kodechirp-frontend:latest
    container_name: kodechirp-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
      INTERNAL_API_URL: http://gateway:4000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - kodechirp-net

  # ── Nginx Reverse Proxy (Edge SSL Termination & Traffic Routing) ─────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: kodechirp-nginx:latest
    container_name: kodechirp-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      ENABLE_SSL_REDIRECT: ${ENABLE_SSL_REDIRECT:-false}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/includes:/etc/nginx/includes:ro,z
      - ./nginx/certs:/etc/nginx/certs:z
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kodechirp-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kodechirp-net:
    driver: bridge
  kodechirp-sandbox-net:
    driver: bridge
    internal: true
