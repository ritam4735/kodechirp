<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100%; background: #0c0c0e; color: white; display: flex; flex-direction: column; }
.min-h-screen { min-height: 100vh; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.flex-1 { flex: 1 1 0%; }
.min-w-0 { min-width: 0px; }
.min-h-0 { min-height: 0px; }
.w-full { width: 100%; }
.h-full { height: 100%; }
.navbar { height: 64px; flex-shrink: 0; background: #141417; }

.kc-workspace-root {
  flex: 1 1 0%;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 100%;
  height: calc(100vh - 64px);
  height: calc(100dvh - 64px);
  max-height: calc(100vh - 64px);
  max-height: calc(100dvh - 64px);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  background-color: #0c0c0e;
  padding: 12px;
}

.kc-workspace-inner {
  width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  flex: 1 1 0%;
  overflow: hidden;
}
</style>
</head>
<body>
  <div class="min-h-screen flex flex-col">
    <div class="navbar">Navbar</div>
    <main class="flex-1 flex flex-col min-w-0 min-h-0">
      <div class="kc-workspace-root" id="root">
        <div class="kc-workspace-inner" id="inner">
          <div id="group-main" style="height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: row; flex-wrap: nowrap;">
            <div id="panel-problem" style="min-height: 0px; max-height: 100%; height: auto; min-width: 0px; max-width: 100%; width: auto; display: flex; flex-basis: 0px; flex-shrink: 1; flex-grow: 40; overflow: visible;">
              <div class="flex flex-col h-full w-full min-h-0 min-w-0" style="max-height: 100%; max-width: 100%; flex-grow: 1; overflow: auto;">
                <div style="height: 100%; background: rgba(255,0,0,0.2);">Left Panel</div>
              </div>
            </div>
            <div style="width: 8px; flex-shrink: 0;"></div>
            <div id="panel-workspace" style="min-height: 0px; max-height: 100%; height: auto; min-width: 0px; max-width: 100%; width: auto; display: flex; flex-basis: 0px; flex-shrink: 1; flex-grow: 60; overflow: visible;">
              <div class="flex flex-col h-full w-full min-h-0 min-w-0" style="max-height: 100%; max-width: 100%; flex-grow: 1; overflow: auto;">
                <div id="group-right" style="height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; flex-wrap: nowrap;">
                  <div id="panel-editor" style="min-height: 0px; max-height: 100%; height: auto; min-width: 0px; max-width: 100%; width: auto; display: flex; flex-basis: 0px; flex-shrink: 1; flex-grow: 65; overflow: visible;">
                    <div class="flex flex-col h-full w-full min-h-0 min-w-0" style="max-height: 100%; max-width: 100%; flex-grow: 1; overflow: auto;">
                      <div style="height: 100%; background: rgba(0,255,0,0.2);">Editor Panel</div>
                    </div>
                  </div>
                  <div style="height: 8px; flex-shrink: 0;"></div>
                  <div id="panel-console" style="min-height: 0px; max-height: 100%; height: auto; min-width: 0px; max-width: 100%; width: auto; display: flex; flex-basis: 0px; flex-shrink: 1; flex-grow: 35; overflow: visible;">
                    <div class="flex flex-col h-full w-full min-h-0 min-w-0" style="max-height: 100%; max-width: 100%; flex-grow: 1; overflow: auto;">
                      <div style="height: 100%; background: rgba(0,0,255,0.2);">Console Panel</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
